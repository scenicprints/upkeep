name: Build & Release APK

# Runs whenever a version tag (e.g. v0.1.0) is pushed by publish.ps1.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # checkout fetches with --no-tags and then recreates the trigger
          # ref itself, which makes the annotated tag LIGHTWEIGHT on the
          # runner. `%(contents)` then silently falls back to the commit
          # message and that ships as "What's New". Both this and the
          # explicit re-fetch below are needed.
          fetch-tags: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify the APK is signed with the upload key
        run: |
          # A debug-signed APK installs fine once and can then NEVER be updated
          # (Android rejects a signature change). Fail loudly here instead.
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          echo "using $APKSIGNER"
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk > certs.txt
          cat certs.txt
          grep -qi "CN=Upkeep" certs.txt || { echo "::error::APK is NOT signed with the upload key"; exit 1; }

      - name: Rename APK to versioned name
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp build/app/outputs/flutter-apk/app-release.apk "upkeep-${VERSION}.apk"

      - name: Extract release notes from tag message
        run: |
          # Force the real annotated tag object down, overwriting whatever
          # checkout left behind.
          git fetch --force origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag" \
            || { echo "::error::$GITHUB_REF_NAME is not an annotated tag — release notes would be the commit message. Tag with 'git tag -a'."; exit 1; }
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > RELEASE_NOTES.txt
          echo "--- release notes ---"; cat RELEASE_NOTES.txt
          test -s RELEASE_NOTES.txt || { echo "::error::empty release notes"; exit 1; }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.txt
          files: upkeep-*.apk
