name: upkeep
description: "Upkeep — maintenance tracker. Every tracked thing is a gauge."
publish_to: 'none'

# Single source of truth for the app version. MUST match the git tag that
# publish.ps1 pushes, because the in-app updater compares this to the tag.
version: 0.4.0+6

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # --- in-app OTA updater (see lib/updater.dart) ---
  http: ^1.2.2
  package_info_plus: ^8.0.2
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  url_launcher: ^6.3.0

  # --- the tracker ---
  flutter_contacts: ^1.1.9          # pick who to text
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.0                 # required by scheduled notifications
  share_plus: ^10.1.4               # hand a backup file to Drive/Gmail/etc
  flutter_secure_storage: ^9.2.2    # the FuelWise read token, never in git

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

# Launcher icon. Regenerate the source art with `python tools/make_icon.py`,
# then `dart run flutter_launcher_icons` to write the res/ folders.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/upkeep_icon.png"
  adaptive_icon_background: "#0A0C0F"
  adaptive_icon_foreground: "assets/icon/upkeep_icon_fg.png"
  min_sdk_android: 23
